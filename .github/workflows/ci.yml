name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: System deps (egui / glow / tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libxdo-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: test (logic)
        run: cargo test --test core_logic -- --nocapture
      - name: build (debug)
        run: cargo build --bin GrokDesktop

  build-windows:
    name: Release build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --test core_logic
      - name: release
        run: cargo build --release --bin GrokDesktop
      # Unversioned CI smoke artifact (90 days). For downloadable versioned
      # clients use the Release workflow (tags / manual) → GitHub Releases.
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrokDesktop-windows-x64-ci
          path: target/release/GrokDesktop.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --test core_logic
      - name: build
        run: cargo build --release --bin GrokDesktop
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrokDesktop-macos-ci
          path: target/release/GrokDesktop
          if-no-files-found: error
          retention-days: 14

  site-check:
    name: Landing page check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify landing assets
        run: |
          test -f preview/index.html
          test -f assets/logo.png
          test -f assets/icon.ico
          # Must not claim official xAI ownership in meta description wrongly later — soft check
          grep -qi "Grok" preview/index.html
