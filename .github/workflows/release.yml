# Versioned Windows Setup.exe (+ portable .exe) and macOS binary on GitHub Releases.
#
#   git tag v0.1.1 && git push origin v0.1.1
#   or Actions → Release → Run workflow → version 0.1.1
#
# Primary download: GrokDesktop-Setup-<ver>-windows-x64.exe  (double-click to install)

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver WITHOUT leading v (e.g. 0.1.1)"
        required: true
        default: "0.1.1"
      draft:
        description: "Create as draft release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - id: out
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version: $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows Setup.exe
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Sync Cargo.toml version
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" Cargo.toml

      - name: Test
        run: cargo test --test core_logic

      - name: Release build
        run: cargo build --release --bin GrokDesktop

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Build Setup.exe + portable .exe
        shell: pwsh
        run: |
          $V = "${{ needs.version.outputs.version }}"
          $Stage = "packaging/stage"
          $Dist = "dist"
          New-Item -ItemType Directory -Force -Path $Stage, $Dist | Out-Null
          Copy-Item target/release/GrokDesktop.exe "$Stage/GrokDesktop.exe" -Force
          Copy-Item packaging/LICENSE.txt, packaging/README.txt, packaging/Uninstall.ps1 $Stage/ -ErrorAction SilentlyContinue
          if (Test-Path LICENSE) { Copy-Item LICENSE "$Stage/LICENSE.txt" -Force }
          Set-Content "$Stage/VERSION.txt" -Value $V -NoNewline -Encoding ascii

          # Portable single-file (download & run, no install)
          $Portable = "dist/GrokDesktop-$V-windows-x64.exe"
          Copy-Item target/release/GrokDesktop.exe $Portable -Force

          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after choco install" }

          & $iscc "/DMyAppVersion=$V" packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          $Setup = "dist/GrokDesktop-Setup-$V-windows-x64.exe"
          if (-not (Test-Path $Setup)) {
            $found = Get-ChildItem dist -Filter "GrokDesktop-Setup-*.exe" | Select-Object -First 1
            if (-not $found) { throw "Setup.exe not produced" }
            $Setup = $found.FullName
          }

          Get-FileHash $Setup -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path $Setup -Leaf)" |
              Out-File "dist/$(Split-Path $Setup -Leaf).sha256" -Encoding ascii
          }
          Get-FileHash $Portable -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path $Portable -Leaf)" |
              Out-File "dist/$(Split-Path $Portable -Leaf).sha256" -Encoding ascii
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/GrokDesktop-Setup-*.exe
            dist/GrokDesktop-*-windows-x64.exe
            dist/*.sha256
          if-no-files-found: error

  build-macos:
    name: macOS binary
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sync Cargo.toml version
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i '' "s/^version = \".*\"/version = \"$V\"/" Cargo.toml
      - name: Test
        run: cargo test --test core_logic
      - name: Release build
        run: cargo build --release --bin GrokDesktop
      - name: Package single binary
        run: |
          V="${{ needs.version.outputs.version }}"
          ARCH=$(uname -m)
          case "$ARCH" in arm64) A=aarch64 ;; x86_64) A=x86_64 ;; *) A=$ARCH ;; esac
          mkdir -p dist
          # Single downloadable binary (no zip)
          cp target/release/GrokDesktop "dist/GrokDesktop-$V-macos-$A"
          chmod +x "dist/GrokDesktop-$V-macos-$A"
          (cd dist && shasum -a 256 "GrokDesktop-$V-macos-$A" | tee "GrokDesktop-$V-macos-$A.sha256")
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/GrokDesktop-*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Flatten assets
        run: |
          mkdir -p out
          find release-assets -type f -exec cp -v {} out/ \;
          ls -la out
      - name: Ensure tag (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists: $TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Grok Desktop ${{ needs.version.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          body: |
            ## Grok Desktop ${{ needs.version.outputs.tag }}

            Unofficial desktop client for the official Grok Build CLI.

            ### Windows — recommended

            | File | What to do |
            |------|------------|
            | **`GrokDesktop-Setup-*-windows-x64.exe`** | **Download → double-click → Install** (no zip) |
            | `GrokDesktop-*-windows-x64.exe` | Portable: download and run (no install) |

            After install: Start Menu → **Grok Desktop**.  
            Still need CLI once: `irm https://x.ai/cli/install.ps1 | iex` then `grok login`.

            ### macOS

            | File | What to do |
            |------|------------|
            | `GrokDesktop-*-macos-*` | Download, `chmod +x`, run (may need Privacy → Open Anyway) |

            ### Checksums
            Matching `*.sha256` files are attached.
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
