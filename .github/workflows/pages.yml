# Deploy landing site from this repo (preview/ → GitHub Pages).
# Site URL: https://qingchencloud.github.io/grok-app/

name: Pages

on:
  push:
    branches: [main, master]
    paths:
      - "preview/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp preview/index.html _site/
          cp preview/robots.txt _site/ 2>/dev/null || true
          cp preview/sitemap.xml _site/ 2>/dev/null || true
          # Self-contained assets under preview/assets (preferred)
          if [ -d preview/assets ]; then
            cp -r preview/assets _site/assets
          else
            mkdir -p _site/assets
            cp -r assets/* _site/assets/
          fi
          # Normalize any leftover relative paths
          sed -i 's|\.\./assets/|assets/|g' _site/index.html
          test -f _site/index.html
          test -f _site/assets/logo.png
          ls -la _site _site/assets | head -30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
